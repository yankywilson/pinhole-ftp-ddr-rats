title: PINHOLE Pseudoword Binary In LOCALAPPDATA
id: 8b2c3d4e-5f60-4172-ac1d-2e3f4a5b6c7d
status: experimental
description: |
    Detects execution or creation of the pseudoword-named payloads dropped by
    PINHOLE (vnc module opcode 14, stealer opcode 11) and by E4del's runpackage.
    Names are 10-15 lowercase letters, vowel-initial, strictly alternating
    consonant/vowel. Two drop paths are covered:
      - single level:  %LOCALAPPDATA%\<pseudoword>.exe          (op 14 vnc drop)
      - nested pkg:     %LOCALAPPDATA%\Packages\<x>\<x>.exe      (package path)
    Observed names: ofozuharasukizo, iloporafefon, izapukecoga, urutucucemel,
    erikituvicaba, esifubulereyog, eyojehiwamefotu.
references:
    - docs/03-pinhole-command-protocol.md
    - docs/06-threat-hunting.md
author: independent analysis
date: 2026/09/01
tags:
    - attack.execution
    - attack.defense-evasion
    - attack.t1036
logsource:
    category: process_creation
    product: windows
detection:
    selection_single:
        Image|re: '\\Users\\[^\\]+\\AppData\\Local\\[a-z]{10,15}\.exe$'
    selection_nested:
        Image|re: '\\Users\\[^\\]+\\AppData\\Local\\Packages\\[a-z]{10,15}\\[a-z]{10,15}\.exe$'
    condition: 1 of selection_*
fields:
    - Image
    - ParentImage
    - CommandLine
    - User
falsepositives:
    - Some legitimate applications use random lowercase names in LOCALAPPDATA.
      Post-filter on the vowel-initial alternating pattern (regex
      ^[aeiou]([bcdfghjklmnpqrstvwxyz][aeiou])+ on the file stem) and correlate
      with parent process or a single command-line argument (the vnc room_id).
level: medium
