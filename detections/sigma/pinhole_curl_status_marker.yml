title: PINHOLE RAT curl Fallback Status Marker
id: 6f0a1e2b-3c4d-4e5f-8a9b-0c1d2e3f4a5b
status: experimental
description: |
    Detects the hardcoded curl.exe command line PINHOLE uses as an HTTP fallback.
    The literal '##STATUS##' is the RAT's own HTTP-status delimiter, baked into the
    binary; it is not a normal curl format token. This is the family's most durable
    host signature - it survives all C2 / infrastructure rotation.
references:
    - docs/04-network-and-c2.md
    - docs/06-threat-hunting.md
author: independent analysis
date: 2026/09/01
tags:
    - attack.command-and-control
    - attack.t1071.001
    - attack.execution
    - attack.t1059
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\curl.exe'
        - OriginalFileName: 'curl.exe'
    selection_marker:
        CommandLine|contains: '##STATUS##'
    condition: selection_img and selection_marker
fields:
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - None known. '##STATUS##' is not used by legitimate curl invocations.
level: high
